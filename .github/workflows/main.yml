name: Build iPhone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project TheBombGame.xcodeproj \
            -target TheBombGame \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/TheBombGame.app Payload/
          zip -r TheBombGame.ipa Payload

      - name: Upload TheBombGame.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheBombGame-iOS-IPA
          path: TheBombGame.ipa
