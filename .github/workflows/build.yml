name: Build The Bomb Game iOS 3D

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Authentic 3D iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download 3D Project Bundle
        run: |
          curl -L -o bundle.zip https://files.catbox.moe/ne753f.zip
          unzip -o bundle.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm ci || npm install
          npm run build
          npx cap sync ios

      - name: Build Authentic Xcode App
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Sideloadable IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/TheBombGame.app
          zip -qr ../../TheBombGame_3D.ipa Payload
          cd ../..

      - name: Upload TheBombGame 3D IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheBombGame-3D-IPA
          path: TheBombGame_3D.ipa
          retention-days: 14
