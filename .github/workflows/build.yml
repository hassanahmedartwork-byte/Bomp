name: Build iPhone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build The Bomb Game iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Native iOS SwiftUI Source & Assets
        run: |
          mkdir -p TheBombGame

          # 1. Project Configuration for XcodeGen
          cat << 'EOF' > project.yml
          name: TheBombGame
          options:
            bundleIdPrefix: com.thebombgame
          targets:
            TheBombGame:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [TheBombGame]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.thebombgame.app
                CURRENT_PROJECT_VERSION: 1
                MARKETING_VERSION: 1.0.0
                GENERATE_INFOPLIST_FILE: YES
                TARGETED_DEVICE_FAMILY: "1"
          EOF

          # 2. Main App Entry Point
          cat << 'EOF' > TheBombGame/TheBombGameApp.swift
          import SwiftUI

          @main
          struct TheBombGameApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # 3. Complete 3D Reference-Matched SwiftUI Game View
          cat << 'EOF' > TheBombGame/ContentView.swift
